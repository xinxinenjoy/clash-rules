# OpenClash 完整配置
redir-port: 7892
tproxy-port: 7895
allow-lan: true
mode: rule
log-level: error
ipv6: false
udp: true
# DNS（OpenClash 安全）
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  use-system-hosts: false
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "time.*"
    - "wahaha.20232024.xyz"
    - "ntp.*"
    - "*.qq.com"
    - "*.wechat.com"
    - "*.weixin.qq.com"
    - "*.tencent.com"
    - "*.msftncsi.com"
    - "www.msftconnecttest.com"
    - "geosite:cn"
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

  proxy-server-nameserver:
    - 8.8.8.8

# 代理订阅（保留 additional-prefix）
proxy-providers:
  专线机场:
    type: http
    interval: 3000
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 1000
    url: "https://subscribe.952100.xyz/sxbuy/231750ed7c8f5e079c57c0a20335b6ca"
    override:
      additional-prefix: "专线 |"

  亏本机场:
    type: http
    interval: 3000
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 1000
    url: "https://dash.knjc.cfd/api/v1/client/subscribe?token=1bcf5a0aec6dfa06bf73cfc6ffbd1463"
    override:
      additional-prefix: "亏本 |"

  极速机场:
    type: http
    interval: 3000
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 1000
    url: "https://jsjc.cfd/api/v1/client/subscribe?token=afb432215e8049436a4a14359fcf988d"
    override:
      additional-prefix: "极速 |"
