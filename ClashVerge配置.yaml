ip: &ip {type: http, interval: 18000, behavior: ipcidr, format: yaml}
classical: &classical {type: http, interval: 18000, behavior: classical, format: yaml}
domain: &domain {type: http, interval: 18000, behavior: domain, format: yaml}
rule-providers:
  wanxin-direct:
    <<: *classical
    url: "https://raw.githubusercontent.com/xinxinenjoy/clash-rules/refs/heads/main/wanxin-direct.yaml"
    path: 配置/wanxin-direct.yaml
  wanxin-proxy:
    <<: *classical
    url: "https://raw.githubusercontent.com/xinxinenjoy/clash-rules/refs/heads/main/wanxin-proxy.yaml"
    path: 配置/wanxin-proxy.yaml
  Loyalsoldier-direct:
    <<: *domain
    url: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"
    path: 配置/Loyalsoldier-direct.yaml
  Loyalsoldier-proxy:
    <<: *domain
    url: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt"
    path: 配置/Loyalsoldier-proxy.yaml
  Loyalsoldier-reject:
    <<: *domain
    url: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: 配置/Loyalsoldier-reject.yaml

rules:
  # ===== 本地 / 私有 =====
  - GEOIP,lan,🚀直连访问,no-resolve
  - GEOSITE,private,DIRECT
  # ===== 用户自定义 =====
  - RULE-SET,wanxin-direct,🚀直连访问
  - RULE-SET,wanxin-proxy,♻️手动选择
  # ===== DNS服务 =====
  - DOMAIN-SUFFIX,clashverge.dev,DNS服务
  - DOMAIN-SUFFIX,cloudflare-dns.com,DNS服务
  - DOMAIN-SUFFIX,dns.google,DNS服务
  - DOMAIN-SUFFIX,quad9.net,DNS服务
  # ===== 精确域名 =====
  - GEOSITE,openai,ChatGPT
  - DOMAIN-SUFFIX,suno.ai,ChatGPT
  - DOMAIN-KEYWORD,suno,ChatGPT
  - GEOSITE,telegram,Telegram
  - GEOSITE,github,GitHub
  - GEOSITE,youtube,YouTuBe
  - GEOSITE,google,谷歌服务
  # ===== 拦截 =====
  - RULE-SET,Loyalsoldier-reject,REJECT
  - GEOSITE,category-ads-all,REJECT
  # ===== GEOIP 精准兜底 =====
  - GEOIP,telegram,Telegram,no-resolve
  - GEOIP,google,谷歌服务,no-resolve
  - GEOIP,twitter,🔄自动兜底,no-resolve
  - GEOIP,netflix,🔄自动兜底,no-resolve
  - GEOIP,facebook,🔄自动兜底,no-resolve
  # ===== 游戏 =====
  - GEOSITE,cn,🚀直连访问
  - GEOSITE,category-games-cn,🚀直连访问
  - GEOSITE,category-games@cn,🚀直连访问
  - GEOSITE,category-game-platforms-download,🚀直连访问
  - GEOSITE,category-games,Game游戏
  # ===== 通用直连 =====
  - RULE-SET,Loyalsoldier-direct,🚀直连访问
  - GEOIP,cn,DIRECT,no-resolve
  # ===== 代理兜底 =====
  - RULE-SET,Loyalsoldier-proxy,♻️手动选择
  # ===== PT =====
  - GEOSITE,category-public-tracker,🚀直连访问
  - GEOSITE,category-pt,🚀直连访问
  # ===== 最终 =====
  - MATCH,最终MACH