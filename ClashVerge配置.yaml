mixed-port: 7890
# redir-port: 7892
# tproxy-port: 7893
allow-lan: false
bind-address: "*"
mode: rule
ipv6: false
udp: true
log-level: error
external-controller: 0.0.0.0:9090
external-ui: UI
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

geodata-mode: true
geox-url:
  geosite: "https://testingcf.jsdelivr.net/gh/v2fly/domain-list-community@release/dlc.dat"
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip-lite.dat"
geo-auto-update: true
geo-update-interval: 24

profile:
  store-selected: true #重置配置后的选择状态
  store-fake-ip: false #fakeip存储模式

tun:
  enable: false
  stack: gvisor
  auto-route: true
  strict-route: true #这里需要注意
  auto-detect-interface: true
  dns-hijack:
  - any:53

dns:
  enable: true
  listen: ':53'
  ipv6: false
  respect-rules: false
  enhanced-mode: 'fake-ip'
  fake-ip-range: '198.18.0.1/16'
  fake-ip-filter-mode: 'blacklist'
  prefer-h3: false
  use-hosts: true
  use-system-hosts: false
  fake-ip-filter: 
    - "*.lan"
    - "*.local"
    - '*.arpa'
    - "time.*"
    - "ntp.*"
    - "*.wechat.com"
    - "*.weixin.qq.com"
    - "*.wx.qq.com"
    - "*.qq.com"
    - "*.qpic.cn"
    - "*.gtimg.com"
    - "*.tenpay.com"
    - "*.tencent.com"
    - "+.market.xiaomi.com"
    - "localhost.ptlogin2.qq.com"
    - "*.msftncsi.com"
    - "www.msftconnecttest.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver:
    - 223.5.5.5
  proxy-server-nameserver:
    - 8.8.8.8
    - 114.114.114.114
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://dns.alidns.com/dns-query

