配置proxiesmatch: &proxiesmatch {proxies: [🔄自动兜底, 🚀直连访问, ♻️手动选择, 🇭🇰HK香港, 🇺🇸US美国, 🇸🇬SG新加坡, 🇯🇵JP日本, 🇹🇼TW台湾, 🇰🇷KR韩国, 🇬🇧UK英国, 🇩🇪DE德国, 🇫🇷FR法国, 🇨🇦CA加拿大, 🇦🇺AU澳大利亚]}
